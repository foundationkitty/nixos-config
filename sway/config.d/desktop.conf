# Set Win key as Modifier
set $mod Mod4

# Font for window titles. Will also be used by the bar.
font pango:monospace 11

# positions

output DP-3 mode 2560x1440@60.000Hz render_bit_depth 10 hdr on position 0 0
output DP-2 mode 2560x1440@119.998Hz render_bit_depth 10 hdr on position 2560 0

# wlsunset

exec_always wlsunset -t 4200 -T 6500 -S 6:30 -s 18:30 -g 1.2

# tasoller

input "4617:31324:TASOLLER_Touch" map_to_output DP-2
bindsym $mod+Shift+t exec ~/.local/bin/tasoller-mode --notify cycle

# rotate

bindsym $mod+Shift+r exec python ~/.config/scripts/desktop-rotate.py
bindsym $mod+Shift+f exec python ~/.config/scripts/desktop-frames.py

# xvsr

bindsym $mod+Shift+v exec xvsr toggle
bindsym $mod+Shift+b exec xvsr ab

# suspend

bindsym $mod+Shift+p exec systemctl suspend

# start a terminal
bindsym $mod+Return exec foot --font 'Monospace'

# Start i3bar to display a workspace bar (plus the system information i3status
# finds out, if available)
bar {
        status_command i3status -c ~/.config/sway/desktop.status
        bindsym button3 exec ~/.config/scripts/audio-switch
}

include ~/.config/sway/main.conf
